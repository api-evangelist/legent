name: Legent
description: 'Legent (listed by Battery Ventures as "Legent Corp.") is an EXITED Battery
  Ventures investment carried on the firm''s list-of-all-companies page with an asterisk
  denoting a realized/exited position. Battery publishes no sector, no founding year
  and no website URL for the entry. An enrichment pass on 2026-07-19 probed every plausible
  domain (legent.com, legent.io, legent.ai, legent.co, legent.net, legent.us, legentcorp.com,
  legentsoftware.com, getlegent.com, uselegent.com, legent.dev) and found NO operating
  company web presence: legent.com is a parked domain-for-sale listing, legent.io is
  an unrelated GoDaddy-builder placeholder for a legal-efficiency venture with no verifiable
  Battery connection, legent.ai redirects to the unrelated dmbio.com, and the remainder
  do not resolve. There is therefore no developer portal, no documentation, no API and
  no artifact surface to enrich. This record exists to document the negative result so
  future enrichment runs do not re-spend cycles on it.'
